<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern, sleek liquid glass Todo List and Rich Notes web app with audio recording, documents, and images." />
    <title>AuraTask & Notes • Liquid Glass Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Ambient Light Dispersion Orbs for Liquid Glass Refraction -->
    <div class="ambient-glow orb-blue"></div>
    <div class="ambient-glow orb-cyan"></div>
    <div class="ambient-glow orb-white"></div>
    <div class="ambient-glow orb-sky"></div>

    <div class="app-layout-split">
      
      <!-- ===================================================================
           LEFT PANEL: Liquid Glass Task Management
           =================================================================== -->
      <main class="glass-card panel-tasks" id="main-panel">
        
        <!-- App Header -->
        <header class="app-header">
          <div class="header-branding">
            <div class="brand-icon-glass">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
              </svg>
            </div>
            <div>
              <h1 class="brand-title">AuraTask</h1>
              <p class="brand-subtitle" id="current-date">Today's Focus</p>
            </div>
          </div>

          <!-- Quick Metrics Badge -->
          <div class="header-metrics glass-pill">
            <div class="metric-item">
              <span class="metric-number" id="metric-completed">0</span>
              <span class="metric-label">Done</span>
            </div>
            <div class="metric-divider"></div>
            <div class="metric-item">
              <span class="metric-number" id="metric-pending">0</span>
              <span class="metric-label">Pending</span>
            </div>
          </div>
        </header>

        <!-- Dynamic Liquid Progress Section -->
        <section class="progress-section" aria-label="Task completion progress">
          <div class="progress-header">
            <span class="progress-title">Progress Overview</span>
            <span class="progress-percentage" id="progress-percentage">0%</span>
          </div>
          <div class="progress-track-glass">
            <div class="progress-bar-liquid" id="progress-bar" style="width: 0%;"></div>
          </div>
        </section>

        <!-- New Task Creation Form -->
        <form class="task-form glass-inset" id="todo-form" autocomplete="off">
          <div class="input-row">
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="16" />
                <line x1="8" y1="12" x2="16" y2="12" />
              </svg>
              <input
                type="text"
                id="todo-input"
                class="glass-input"
                placeholder="What needs to get done today?"
                maxlength="120"
                required
              />
            </div>
            <button type="submit" class="glass-btn primary-btn" id="add-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              <span>Add</span>
            </button>
          </div>

          <!-- Task Options Row (Priority & Category) -->
          <div class="form-options-row">
            <div class="option-group">
              <label for="priority-select" class="option-label">Priority:</label>
              <div class="glass-select-wrapper">
                <select id="priority-select" class="glass-select">
                  <option value="medium" selected>⚡ Medium</option>
                  <option value="high">🔥 High</option>
                  <option value="low">🌱 Low</option>
                </select>
              </div>
            </div>

            <div class="option-group">
              <label for="category-select" class="option-label">Tag:</label>
              <div class="glass-select-wrapper">
                <select id="category-select" class="glass-select">
                  <option value="Work" selected>💼 Work</option>
                  <option value="Personal">🏡 Personal</option>
                  <option value="Study">📚 Study</option>
                  <option value="Health">💪 Health</option>
                  <option value="Urgent">🚨 Urgent</option>
                  <option value="General">✨ General</option>
                </select>
              </div>
            </div>
          </div>
        </form>

        <!-- Controls Toolbar: Search & Filter Tabs -->
        <div class="controls-toolbar">
          <!-- Live Search Bar -->
          <div class="search-box glass-inset">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="search-input"
              class="glass-input search-input"
              placeholder="Search tasks..."
            />
            <button type="button" id="clear-search-btn" class="clear-search-btn hidden" aria-label="Clear search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>

          <!-- Filter Tabs -->
          <div class="filter-tabs glass-inset" role="tablist">
            <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
              All <span class="tab-count" id="count-all">0</span>
            </button>
            <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">
              Active <span class="tab-count" id="count-active">0</span>
            </button>
            <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
              Done <span class="tab-count" id="count-completed">0</span>
            </button>
          </div>
        </div>

        <!-- Task List Container -->
        <ul class="todo-list" id="todo-list" aria-live="polite">
          <!-- Populated dynamically via TypeScript -->
        </ul>

        <!-- Empty State Placeholder -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon-glass">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <h3 class="empty-title">All tasks cleared</h3>
          <p class="empty-subtitle">Take a breath, or add a fresh item above to get started.</p>
        </div>

        <!-- App Footer Actions -->
        <footer class="app-footer">
          <span class="footer-summary" id="footer-summary">0 items left</span>
          <div class="footer-actions">
            <button type="button" class="glass-btn-text" id="clear-completed-btn">
              Clear Completed
            </button>
          </div>
        </footer>

      </main>

      <!-- ===================================================================
           RIGHT PANEL: Liquid Glass Rich Notes & Voice Workspace
           =================================================================== -->
      <section class="glass-card panel-notes" id="notes-panel">
        
        <!-- Notes Header & Selector -->
        <header class="notes-header">
          <div class="header-branding">
            <div class="brand-icon-glass note-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div>
              <h2 class="brand-title">AuraNotes</h2>
              <p class="brand-subtitle" id="notes-status-badge">IndexedDB Synced</p>
            </div>
          </div>

          <!-- Note Actions (New Note, Notes List Dropdown) -->
          <div class="notes-header-actions">
            <div class="glass-select-wrapper note-switcher-wrapper">
              <select id="notes-select" class="glass-select notes-select" aria-label="Select note">
                <!-- Populated dynamically -->
              </select>
            </div>

            <button type="button" id="new-note-btn" class="glass-btn glass-btn-icon" title="Create New Note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>New</span>
            </button>

            <button type="button" id="delete-note-btn" class="glass-btn glass-btn-danger" title="Delete current note">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </header>

        <!-- Note Title Input -->
        <div class="note-title-box glass-inset">
          <input
            type="text"
            id="note-title-input"
            class="note-title-input"
            placeholder="Note Title..."
            maxlength="100"
          />
        </div>

        <!-- Rich Text Formatting Toolbar -->
        <div class="richtext-toolbar glass-inset" role="toolbar" aria-label="Text Formatting">
          <button type="button" class="toolbar-btn" data-command="bold" title="Bold (Ctrl+B)">
            <strong>B</strong>
          </button>
          <button type="button" class="toolbar-btn" data-command="italic" title="Italic (Ctrl+I)">
            <em>I</em>
          </button>
          <button type="button" class="toolbar-btn" data-command="underline" title="Underline (Ctrl+U)">
            <u>U</u>
          </button>
          <button type="button" class="toolbar-btn" data-command="strikeThrough" title="Strikethrough">
            <s>S</s>
          </button>
          <div class="toolbar-divider"></div>
          <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h3" title="Heading 3">
            H3
          </button>
          <button type="button" class="toolbar-btn" data-command="insertUnorderedList" title="Bullet List">
            • List
          </button>
          <button type="button" class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
            1. List
          </button>
          <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="blockquote" title="Quote">
            “ ”
          </button>
          <div class="toolbar-divider"></div>
          <button type="button" class="toolbar-btn" data-command="removeFormat" title="Clear Formatting">
            ✕
          </button>
        </div>

        <!-- ContentEditable Rich Text Field with Drag & Drop -->
        <div
          id="richtext-editor"
          class="richtext-editor glass-inset"
          contenteditable="true"
          placeholder="Start writing notes, drop images or documents, or record voice memos..."
          role="textbox"
          aria-multiline="true"
        ></div>

        <!-- Media Attachments & Voice Studio Toolbar -->
        <div class="media-actions-bar">
          <!-- Voice Recording Trigger & Status -->
          <div class="voice-recorder-suite">
            <button type="button" id="record-audio-btn" class="record-btn glass-btn">
              <span class="mic-dot"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <span id="record-btn-text">Voice Memo</span>
            </button>
            <span id="recording-timer" class="recording-timer hidden">00:00</span>
          </div>

          <!-- Document / Image Upload Trigger -->
          <div class="file-upload-wrapper">
            <input
              type="file"
              id="file-attachment-input"
              multiple
              accept="image/*,.pdf,.doc,.docx,.txt,.md"
              class="hidden"
            />
            <button type="button" id="attach-file-btn" class="glass-btn glass-btn-secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              <span>Attach File / Image</span>
            </button>
          </div>
        </div>

        <!-- Voice Audio Memos Section -->
        <div id="audio-memos-container" class="audio-memos-container">
          <!-- Voice memos will be rendered here -->
        </div>

        <!-- Attached Documents & Images Gallery -->
        <div id="attachments-container" class="attachments-container">
          <!-- Attachment chips and image cards rendered here -->
        </div>

        <!-- Notes Footer & Auto-save Status -->
        <footer class="notes-footer">
          <span id="note-meta-info" class="note-meta-info">Created recently</span>
          <button type="button" id="save-note-btn" class="glass-btn primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Save Note</span>
          </button>
        </footer>

      </section>

    </div>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" class="lightbox-modal hidden">
      <div class="lightbox-backdrop"></div>
      <div class="lightbox-content glass-card">
        <button id="close-lightbox" class="close-lightbox-btn" aria-label="Close image preview">✕</button>
        <img id="lightbox-img" src="" alt="Enlarged preview" />
      </div>
    </div>

    <!-- Main TypeScript Entry -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
